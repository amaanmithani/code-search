[project]
name = "codesearch"
version = "0.1.0"
description = "Semantic code search: tree-sitter chunking, BM25 + dense hybrid retrieval, cross-encoder reranking, and an honest evaluation."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-typescript>=0.23",
    "numpy>=1.26",
    "httpx>=0.27",
    "fastapi>=0.110",
]

[project.optional-dependencies]
rerank = ["onnxruntime>=1.17", "tokenizers>=0.15", "huggingface-hub>=0.23"]
serve = ["uvicorn>=0.29"]

[project.scripts]
codesearch = "codesearch.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesearch"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
[[tool.mypy.overrides]]
module = ["tree_sitter_python", "tree_sitter_go", "tree_sitter_typescript", "onnxruntime", "tokenizers", "huggingface_hub"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=codesearch --cov-report=term-missing --cov-fail-under=75"

[tool.coverage.run]
source = ["codesearch"]
